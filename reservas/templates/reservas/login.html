{% extends "reservas/base.html" %}
{% block titulo %}Ingreso{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-5">
<form method="post" class="card card-body">
  {% csrf_token %}
  <h1 class="h4">Ingreso del personal</h1>
  {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
  <label class="form-label small" for="u">Usuario</label><input class="form-control mb-2" id="u" name="username" autofocus>
  <label class="form-label small" for="p">Contraseña</label><input class="form-control mb-3" id="p" type="password" name="password">
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-rosa">Ingresar</button>
</form>
</div></div>
{% endblock %}
