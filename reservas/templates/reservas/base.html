<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Reservas{% endblock %} · RG Beauty Spa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--rosa:#b5536f;--rosa-osc:#8e3a54;--rosa-cl:#f6e4ea;--nude:#fbf6f3}
body{background:var(--nude)}
.navbar-brand{font-family:Georgia,serif;color:var(--rosa-osc)!important;font-weight:600}
.btn-rosa{background:var(--rosa);border-color:var(--rosa);color:#fff}.btn-rosa:hover{background:var(--rosa-osc);border-color:var(--rosa-osc);color:#fff}
.btn-outline-rosa{border-color:var(--rosa);color:var(--rosa-osc)}.btn-outline-rosa:hover,.btn-check:checked+.btn-outline-rosa{background:var(--rosa);color:#fff;border-color:var(--rosa)}
.card{border-color:#eadde1;border-radius:14px}
.hora-ocupada{text-decoration:line-through;opacity:.45}
.kpi .n{font-size:1.6rem;font-weight:700}
.estado-agendada{background:var(--rosa-cl);color:var(--rosa-osc)}
.estado-asistio{background:#e3f2ea;color:#2f7d5b}.estado-no_show{background:#f8e3e1;color:#b3403a}.estado-cancelada{background:#eee;color:#777}
.paso{width:28px;height:28px;border-radius:50%;background:var(--rosa);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:.9rem;margin-right:.4rem}
</style>
</head>
<body>
<nav class="navbar navbar-expand bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'reservar' %}">RG Beauty Spa</a>
    <div class="navbar-nav ms-auto flex-wrap">
      <a class="nav-link" href="{% url 'reservar' %}">Reservar</a>
      <a class="nav-link" href="{% url 'mis_reservas' %}">Mis reservas</a>
      {% if user.is_staff %}
        <a class="nav-link" href="{% url 'panel' %}">Panel</a>
        <a class="nav-link" href="{% url 'historial' %}">Historial</a>
        <a class="nav-link" href="{% url 'admin:index' %}">Configuración</a>
        <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="nav-link btn btn-link">Salir</button></form>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Ingreso personal</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container pb-5">
  {% for m in messages %}
    <div class="alert {% if m.tags == 'error' %}alert-danger{% else %}alert-success{% endif %}">{{ m }}</div>
  {% endfor %}
  {% block contenido %}{% endblock %}
</main>
<footer class="text-center text-muted small pb-4">RG Beauty Spa · Prototipo académico INACAP · Grupo 4</footer>
</body>
</html>
